  <text x="154" y="248" fill="#A7B0C0" font-family="Poppins, Inter, Arial, sans-serif" font-size="14">Current codebase</text>

  <line x1="334" y1="226" x2="446" y2="226" stroke="#FF6A1A" stroke-width="3" marker-end="url(#arrow)"/>

