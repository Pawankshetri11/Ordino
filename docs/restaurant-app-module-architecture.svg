  <line x1="619" y1="120" x2="619" y2="156" stroke="#FF6A1A" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="876" y="610" width="300" height="72" rx="20" fill="#F0FFF5" stroke="#C9F2D8"/>
