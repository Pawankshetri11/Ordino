    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#D86B2B" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="64" y="174" width="270" height="104" rx="28" fill="#111827" filter="url(#shadow)"/>
