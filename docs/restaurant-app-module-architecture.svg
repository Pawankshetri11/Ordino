<svg width="1280" height="760" viewBox="0 0 1280 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="760" rx="36" fill="#FFF8F3"/>
  <text x="64" y="76" fill="#111827" font-family="Poppins, Inter, Arial, sans-serif" font-size="34" font-weight="500">Ordino Restaurant App Architecture</text>
  <text x="64" y="112" fill="#667085" font-family="Poppins, Inter, Arial, sans-serif" font-size="17" font-weight="400">Modules feature-based rahenge. Role + permissions decide karega kisko kya dikhega.</text>

  <defs>
